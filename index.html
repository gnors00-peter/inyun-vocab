    switch (code) {
      case "cancelled":
        return null; // silent
      case "not_granted":
      case "sampling_disabled":
      case "not_declared":
      case "capability_disabled":
      case "capability_removed":
        return "이 기능을 사용할 수 없어요. (Claude 사용 권한이 꺼져 있어요)";
      case "images_unavailable":
        return "이 화면에서는 사진을 분석할 수 없어요.";
      case "rate_limited":
        return "잠시 요청이 많아요. 조금 이따가 다시 시도해주세요.";
      case "session_expired":
        return "세션이 만료됐어요. 새로고침 후 다시 시도해주세요.";
      case "image_rejected":
        return "사진을 인식할 수 없어요. 다른 사진으로 시도해주세요.";
      case "empty_completion":
      case "invalid_json":
        return "사진에서 단어를 읽어오지 못했어요. 더 선명한 사진으로 시도해주세요.";
      case "refused":
        return "요청을 처리할 수 없었어요.";
      default:
        return "사진을 읽어오는 중 문제가 생겼어요. 다시 시도해주세요.";
    }
  }

  function handlePhotoFiles(files) {
    if (!files || files.length === 0) return;
    if (!sampleRef) {
      showInfoModal("이 기기/화면에서는 사진으로 단어 읽기 기능을 사용할 수 없어요.");
      return;
    }
    if (photoAddBusy) return;
    setPhotoAddBusy(true);
    sampleRef.limits().then(function (limits) {
      if (!limits || !limits.images) {
        setPhotoAddBusy(false);
        showInfoModal("이 화면에서는 사진 분석 기능을 사용할 수 없어요.");
        return;
      }
      var maxCount = limits.images.maxCount || 1;
      var picked = Array.prototype.slice.call(files, 0, maxCount);
      return sampleRef.json(buildPhotoPrompt(), { images: picked, modelTier: "default", cache: false })
        .then(function (data) {
          setPhotoAddBusy(false);
          var items = Array.isArray(data) ? data : (data && Array.isArray(data.items) ? data.items : null);
          if (!items) {
            showInfoModal("사진에서 단어를 읽어오지 못했어요. 더 선명한 사진으로 시도해주세요.");
            return;
          }
          openPhotoReviewModal(items);
        })
        .catch(function (err) {
          setPhotoAddBusy(false);
          var msg = sampleErrorMessage(err);
          if (msg) showInfoModal(msg);
        });
    }).catch(function () {
      setPhotoAddBusy(false);
      showInfoModal("사진 분석 기능을 준비하지 못했어요. 다시 시도해주세요.");
    });
  }

  function openPhotoReviewModal(items) {
    var cleaned = items
      .map(function (it) {
        return {
          word: String((it && it.word) || "").trim(),
          meaning: String((it && it.meaning) || "").trim(),
          example: String((it && it.example) || "").trim()
        };
      })
      .filter(function (it) { return it.word && it.meaning; });

    if (cleaned.length === 0) {
      showInfoModal("사진에서 단어를 읽어오지 못했어요. 더 선명한 사진으로 시도해주세요.");
      return;
    }

    var existingWords = {};
    words.forEach(function (w) { existingWords[(w.word || "").toLowerCase()] = true; });

    var overlay = document.createElement("div");
    overlay.className = "confirm-overlay";
    var rowsHtml = cleaned.map(function (it, i) {
      var isDup = !!existingWords[it.word.toLowerCase()];
      return (
        '<label class="review-item' + (isDup ? " dup" : "") + '">' +
          '<input type="checkbox" data-idx="' + i + '"' + (isDup ? "" : " checked") + '>' +
          "<span>" +
            '<div class="rw">' + escapeHtml(it.word) + "</div>" +
            '<div class="rm">' + escapeHtml(it.meaning) + "</div>" +
            (it.example ? '<div class="rex">' + escapeHtml(it.example) + "</div>" : "") +
            (isDup ? '<div class="dup-tag">이미 단어장에 있어요</div>' : "") +
          "</span>" +
        "</label>"
      );
    }).join("");

    overlay.innerHTML =
      '<div class="review-box">' +
        "<h3>사진에서 " + cleaned.length + "개의 단어를 찾았어요</h3>" +
        '<div class="review-sub">추가할 단어를 확인하고 체크해주세요. (이미 있는 단어는 기본적으로 체크 해제되어 있어요)</div>' +
        '<div class="review-list">' + rowsHtml + "</div>" +
        '<div class="confirm-actions">' +
          '<button class="cancel" id="reviewCancelBtn">취소</button>' +
          '<button class="ok" id="reviewOkBtn">선택한 단어 추가</button>' +
        "</div>" +
      "</div>";
    document.body.appendChild(overlay);

    function close() { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }
    overlay.addEventListener("click", function (e) { if (e.target === overlay) close(); });
    overlay.querySelector("#reviewCancelBtn").onclick = close;
    overlay.querySelector("#reviewOkBtn").onclick = function () {
      var checked = Array.prototype.filter.call(
        overlay.querySelectorAll('input[type="checkbox"]'),
        function (cb) { return cb.checked; }
      );
      if (checked.length === 0) { close(); return; }
      if (!dbRef) { close(); showInfoModal("저장소를 사용할 수 없어요."); return; }
      var toAdd = checked.map(function (cb) { return cleaned[parseInt(cb.getAttribute("data-idx"), 10)]; });
      var pending = toAdd.length;
      close();
      toAdd.forEach(function (it) {
        dbRef.collection("words").add({
          word: it.word,
          meaning: it.meaning,
          example: it.example,
          addedAt: fmtTime(),
          source: "photo",
          correctCount: 0,
          wrongCount: 0,
          choiceMasteryScore: 0,
          spellingMasteryScore: 0,
          mastered: false
        }).catch(function () {});
      });
      var toast = byId("addToast");
      toast.style.color = "var(--good)";
      toast.textContent = toAdd.length + "개의 단어를 사진에서 추가했어요!";
    };
  }

  byId("photoAddBtn").onclick = function () {
    if (!sampleRef) {
      showInfoModal("이 기기/화면에서는 사진으로 단어 읽기 기능을 사용할 수 없어요.");
      return;
    }
    byId("photoAddInput").click();
  };
  byId("photoAddInput").addEventListener("change", function (e) {
    var files = e.target.files;
    handlePhotoFiles(files);
    e.target.value = "";
  });

  // ---------- helpers ----------
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // Pronunciation voice: fixed to "Evan" (installed on 인윤이's Mac).
  // Falls back to any English voice if Evan isn't available on whatever
  // device happens to open this page.
  var PREFERRED_VOICE_NAME = "Evan";
  var cachedVoice = null;
  var voicesReady = false;

  function pickVoice() {
    if (!("speechSynthesis" in window)) return null;
    var voices = window.speechSynthesis.getVoices() || [];
    if (voices.length === 0) return null;
    var exact = voices.find(function (v) { return v.name === PREFERRED_VOICE_NAME; });
    if (exact) return exact;
    var partial = voices.find(function (v) { return v.name.toLowerCase().indexOf(PREFERRED_VOICE_NAME.toLowerCase()) !== -1; });
    if (partial) return partial;
    var enVoice = voices.find(function (v) { return /^en/i.test(v.lang); });
    return enVoice || voices[0] || null;
  }

  function ensureVoice() {
    if (!("speechSynthesis" in window)) return;
    cachedVoice = pickVoice();
    if (cachedVoice) voicesReady = true;
  }
  ensureVoice();
  if ("speechSynthesis" in window) {
    window.speechSynthesis.onvoiceschanged = ensureVoice;
  }

  function speak(text) {
    try {
      if (!("speechSynthesis" in window)) return;
      if (!voicesReady) ensureVoice();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = 0.8;
      u.pitch = 0.92;
      if (cachedVoice) {
        u.voice = cachedVoice;
        u.lang = cachedVoice.lang || "en-US";
      }
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  // ---------- tabs ----------
  document.querySelectorAll("nav.tabs button").forEach(function (btn) {
    btn.onclick = function () {
      currentView = btn.getAttribute("data-view");
      document.querySelectorAll("nav.tabs button").forEach(function (b) { b.classList.toggle("active", b === btn); });
      document.querySelectorAll("section").forEach(function (s) { s.classList.remove("active"); });
      byId("view-" + currentView).classList.add("active");
      if (currentView === "history") renderHistory();
      render();
    };
  });

  document.querySelectorAll("#quizModeToggle button").forEach(function (btn) {
    btn.onclick = function () {
      var mode = btn.getAttribute("data-mode");
      if (mode === quizMode) return;
      quizMode = mode;
      quizDone = false;
      quizQueue = [];
      quizIdx = 0;
      spellingRetry = [];
      spellingPhase = "first";
      quizPracticeMode = false;
      document.querySelectorAll("#quizModeToggle button").forEach(function (b) { b.classList.toggle("active", b === btn); });
      renderQuizIfNeeded();
    };
  });

  byId("statCardTotal").onclick = function () { openListView("all"); };
  byId("statCardMastered").onclick = function () { openListView("mastered"); };
  byId("statCardLearning").onclick = function () { openListView("learning"); };

  byId("addBtn").onclick = submitWord;
  byId("inExample").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) submitWord();
  });
  ["inWord", "inMeaning"].forEach(function (id) {
    byId(id).addEventListener("keydown", function (e) { if (e.key === "Enter") submitWord(); });
  });
  byId("listSearch").addEventListener("input", renderList);

  // ---------- boot (Firebase) ----------
  // 사진으로 단어 추가 기능(Claude AI 활용)은 Claude 안에서만 동작해서
  // 외부 호스팅 버전에서는 sampleRef가 항상 null로 남고, 기존 코드가
  // 이를 감지해서 안내 메시지를 보여주며 자연스럽게 비활성화돼요.
  var firebaseConfig = {
    apiKey: "AIzaSyC_vILEd6JvK4a3uAf6UnSsLKt8623q9bQ",
    authDomain: "inyun-vocab.firebaseapp.com",
    projectId: "inyun-vocab",
    storageBucket: "inyun-vocab.firebasestorage.app",
    messagingSenderId: "80382714903",
    appId: "1:80382714903:web:268e02d711662010a46852"
  };

  function boot() {
    try {
      firebase.initializeApp(firebaseConfig);
      dbRef = firebase.firestore();
    } catch (e) {
      byId("dbStatus").textContent = "저장소 사용 불가";
      render();
      return;
    }
    byId("dbStatus").textContent = "";
    loadDayTimeTotals(todayStr());
    dbRef.collection("words").onSnapshot(function (snap) {
      words = snap.docs.map(function (d) {
        return Object.assign({ id: d.id }, d.data());
      });
      migrateMasteryScores();
      render();
    }, function () {
      byId("dbStatus").textContent = "동기화 오류";
    });
  }

  boot();
})();
</script>
